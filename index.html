:root{
  --bg:#0A0E14;
  --surface:#151B26;
  --surface-2:#1C2533;
  --surface-3:#222E40;
  --line:#263041;
  --line-2:#32405A;
  --primary:#3A8DDE;
  --primary-soft:rgba(58,141,222,.16);
  --accent:#FF8A00;
  --accent-soft:rgba(255,138,0,.15);
  --text:#FFFFFF;
  --muted:#9AA8BC;
  --muted-2:#6E7D94;
  --success:#2FBF71;
  --warning:#FFB020;
  --danger:#FF5252;
  --gray:#8A94A6;
}
*{
  box-sizing:border-box
}
html,body,#root{
  margin:0;
  min-height:100%;
  background:#05070B;
  color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,-apple-system,sans-serif
}
button,input,select,textarea{
  font-family:inherit
}
button{
  cursor:pointer
}
input,select,textarea{
  outline:none
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary)!important;
  box-shadow:0 0 0 3px rgba(58,141,222,.18)
}
.no-scrollbar::-webkit-scrollbar{
  display:none
}
.no-scrollbar{
  scrollbar-width:none
}
.chip-active{
  box-shadow:0 6px 18px rgba(58,141,222,.25)
}
.card-shadow{
  box-shadow:0 10px 28px rgba(0,0,0,.28)
}
.sheet{
  animation:sheetUp .22s ease-out
}
@keyframes sheetUp{
  from{
    transform:translateY(18px);
    opacity:.6
  }
  to{
    transform:translateY(0);
    opacity:1
  }
}
.toast-in{
  animation:toastIn .22s ease-out
}
@keyframes toastIn{
  from{
    transform:translateY(10px);
    opacity:0
  }
  to{
    transform:translateY(0);
    opacity:1
  }
}
.fade-in{
  animation:fadeIn .18s ease-out
}
@keyframes fadeIn{
  from{
    opacity:0
  }
  to{
    opacity:1
  }
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A0E14;
    --surface:#151B26
  }
}
.last\:border-0:last-child {
  border-width: 0px;
}
.active\:scale-\[0\.99\]:active {
